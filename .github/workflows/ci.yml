name: Accounts CI

on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/hostauth-adapter/package-lock.json
      - name: Install DOM test dependency
        shell: pwsh
        run: |
          npm ci --prefix packages/hostauth-adapter --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Host dependencies failed.' }
          npm ci --prefix packages/localization --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Localization dependencies failed.' }
      - name: Build and test Accounts component
        shell: pwsh
        run: ./scripts/Build.ps1 -DotNet dotnet -LockedRestore -Test
      - name: Test host adapter and installation logic
        shell: pwsh
        run: |
          node --test packages/hostauth-adapter/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host adapter tests failed.' }
          node --test packages/account-plugin/test/*.test.mjs packages/account-plugin/test/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Account plugin tests failed.' }
          npm test --prefix packages/localization
          if ($LASTEXITCODE -ne 0) { throw 'Localization tests failed.' }
          node --test packages/compatibility/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility tests failed.' }
      - name: Build and inspect portable package
        shell: pwsh
        run: |
          ./scripts/Publish-Accounts.ps1 -DotNet dotnet -OutputRoot artifacts/accounts/ci
          $manifests = @(Get-ChildItem artifacts/accounts/ci -Recurse -Filter package-manifest.json)
          if ($manifests.Count -ne 1) { throw 'Expected exactly one built package.' }
          ./scripts/Test-AccountsPackage.ps1 -PackageRoot $manifests[0].Directory.FullName
          ./scripts/Publish-Compatibility.ps1 -AccountsPackageRoot $manifests[0].Directory.FullName -OutputRoot artifacts/compatibility/ci
