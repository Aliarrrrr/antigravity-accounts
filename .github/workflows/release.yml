name: Release Accounts

on:
  push:
    tags: ['accounts-v*']

permissions:
  contents: read

concurrency:
  group: release-accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/hostauth-adapter/package-lock.json
      - name: Install DOM test dependency
        shell: pwsh
        run: npm ci --prefix packages/hostauth-adapter --ignore-scripts --no-audit --no-fund
      - name: Build and run offline tests
        shell: pwsh
        run: |
          ./scripts/Build.ps1 -DotNet dotnet -LockedRestore -Test
          node --test packages/hostauth-adapter/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host adapter tests failed.' }
          node --test packages/account-plugin/test/*.test.mjs packages/account-plugin/test/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Account plugin tests failed.' }
      - name: Build and inspect tagged release
        id: package
        shell: pwsh
        run: |
          ./scripts/Publish-Accounts.ps1 -DotNet dotnet -OutputRoot artifacts/accounts/release -Release
          $manifests = @(Get-ChildItem artifacts/accounts/release -Recurse -Filter package-manifest.json)
          if ($manifests.Count -ne 1) { throw 'Expected exactly one built package.' }
          $manifest = Get-Content $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "accounts-v$($manifest.version)" -or $manifest.provenance.commit -cne $env:GITHUB_SHA -or $manifest.provenance.dirty) { throw 'Release source does not match tag and commit.' }
          ./scripts/Test-AccountsPackage.ps1 -PackageRoot $manifests[0].Directory.FullName
          "version=$($manifest.version)" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Upload validated release assets
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-accounts-win-x64
          path: |
            artifacts/accounts/release/AntigravityAccounts-*-win-x64.zip
            artifacts/accounts/release/AntigravityAccounts-*-win-x64.zip.sha256.json
            artifacts/accounts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only validated assets enter the writable job; no source checkout or rebuild.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: validated
          merge-multiple: true
      - name: Verify assets and publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -cne "accounts-v$env:VALIDATED_VERSION") { throw 'Validated version/tag mismatch.' }
          $files = @(Get-ChildItem validated -Recurse -File)
          $name = "AntigravityAccounts-$env:VALIDATED_VERSION-win-x64.zip"
          $asset = @($files | Where-Object Name -CEQ $name)
          $proof = @($files | Where-Object Name -CEQ ($name + '.sha256.json'))
          $sums = @($files | Where-Object Name -CEQ 'SHA256SUMS.txt')
          if ($files.Count -ne 3 -or $asset.Count -ne 1 -or $proof.Count -ne 1 -or $sums.Count -ne 1) { throw 'Unexpected release assets.' }
          $hash = Get-Content $proof[0].FullName -Raw | ConvertFrom-Json
          $actual = (Get-FileHash $asset[0].FullName -Algorithm SHA256).Hash
          if ($hash.file -cne $name -or $hash.sha256 -ine $actual) { throw 'ZIP checksum mismatch.' }
          if ((Get-Content $sums[0].FullName -Raw).Trim() -ine "$actual  $name") { throw 'SHA256SUMS mismatch.' }
          $assets = @($files | ForEach-Object FullName)
          $notes = 'Windows x64 preview of Antigravity Accounts. The native model picker now uses compact rows, separate account names and status, single separators and dedicated selection, waiting, chevron and settings icons. Account management adds status labels, reduces repeated emails and button borders, and unifies controls, focus and narrow-window layout. Pending Google authorization can be cancelled without changing saved accounts. This release fixes partially completed multi-window switch cleanup, concurrent recovery, Enter-to-save label state and deletion/polling focus. Installer process recognition accepts Windows path casing changes in the verified Node launcher while retaining exact command and parent checks. Account-store updates reject a 101st new account and encrypted files larger than 4 MiB before replacing existing data; saved accounts can still be reauthorized. On 7 November 2026, before the final visual changes, an authorized development-package check completed exactly three pure-text UI submissions in one conversation across Account A to Account B to Account A, recalling first-message markers while retaining drafts, model, conversation and process identities. This is not a repeat of every final tagged package; background metadata, title-generation and possible retry requests were not counted. Attachments, tool/subagent history, long contexts, exact quota charging, queued sends, expired-token renewal and a real vendor-installer upgrade remain unverified. Native plugin discovery and persisted enabled preferences worked in an isolated service, but the switch does not yet control Accounts HostAuth. Includes a self-contained component and host adapter; no official program files or account credentials are bundled. The UI build was installed on Antigravity 2.29.0 with Chinese localization retained; the native menu/dialog, status badges, deduplicated email, Escape dismissal and focus return were observed with zero new model submissions, account switches or edits. Separate synthetic browser pages checked dark/light themes, 390-pixel width, long labels, Enter-save, login cancellation and Tab wrapping. The local Release build had zero warnings/errors; component checks passed 44/44, Node checks passed 228/228 without skips, and package/ZIP inspection passed. To upgrade, exit Antigravity, restore any Chinese localization, run Restore.cmd from the newly extracted preview.11 package to restore the existing receipt and saved originals, then its Install-Preview.cmd and reapply localization. Older restore helpers may misclassify verified Node sidecars because of Windows path casing; current-program and backup checks remain required. See README, VALIDATION.md and the 7 November implementation audit for scope and recovery.'
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title "Antigravity Accounts $env:VALIDATED_VERSION" --prerelease --latest=false --verify-tag --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
