name: Release Accounts

on:
  push:
    tags: ['accounts-v*']

permissions:
  contents: read

concurrency:
  group: release-accounts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/hostauth-adapter/package-lock.json
      - name: Install DOM test dependency
        shell: pwsh
        run: |
          npm ci --prefix packages/hostauth-adapter --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Host dependencies failed.' }
          npm ci --prefix packages/localization --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Localization dependencies failed.' }
      - name: Build and run offline tests
        shell: pwsh
        run: |
          ./scripts/Build.ps1 -DotNet dotnet -LockedRestore -Test
          node --test packages/hostauth-adapter/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Host adapter tests failed.' }
          node --test packages/account-plugin/test/*.test.mjs packages/account-plugin/test/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Account plugin tests failed.' }
          npm test --prefix packages/localization
          if ($LASTEXITCODE -ne 0) { throw 'Localization tests failed.' }
          node --test packages/compatibility/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility tests failed.' }
      - name: Build and inspect tagged release
        id: package
        shell: pwsh
        run: |
          ./scripts/Publish-Accounts.ps1 -DotNet dotnet -OutputRoot artifacts/accounts/release -Release
          $manifests = @(Get-ChildItem artifacts/accounts/release -Recurse -Filter package-manifest.json)
          if ($manifests.Count -ne 1) { throw 'Expected exactly one built package.' }
          $manifest = Get-Content $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "accounts-v$($manifest.version)" -or $manifest.provenance.commit -cne $env:GITHUB_SHA -or $manifest.provenance.dirty) { throw 'Release source does not match tag and commit.' }
          ./scripts/Test-AccountsPackage.ps1 -PackageRoot $manifests[0].Directory.FullName
          ./scripts/Publish-Compatibility.ps1 -AccountsPackageRoot $manifests[0].Directory.FullName -OutputRoot artifacts/compatibility/release -Release
          "version=$($manifest.version)" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Upload validated release assets
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-accounts-win-x64
          path: |
            artifacts/accounts/release/AntigravityAccounts-*-win-x64.zip
            artifacts/accounts/release/AntigravityAccounts-*-win-x64.zip.sha256.json
            artifacts/accounts/release/SHA256SUMS.txt
            artifacts/compatibility/release/AntigravityCompatibility-*-win-x64.zip
            artifacts/compatibility/release/AntigravityCompatibility-*-win-x64.zip.sha256.json
            artifacts/compatibility/release/COMPATIBILITY-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only validated assets enter the writable job; no source checkout or rebuild.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: validated
          merge-multiple: true
      - name: Verify assets and publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -cne "accounts-v$env:VALIDATED_VERSION") { throw 'Validated version/tag mismatch.' }
          $files = @(Get-ChildItem validated -Recurse -File)
          if ($files.Count -ne 6) { throw 'Unexpected release assets.' }
          foreach ($kind in @(@{prefix='AntigravityAccounts';sums='SHA256SUMS.txt'},@{prefix='AntigravityCompatibility';sums='COMPATIBILITY-SHA256SUMS.txt'})) {
            $name = "$($kind.prefix)-$env:VALIDATED_VERSION-win-x64.zip"
            $asset = @($files | Where-Object Name -CEQ $name)
            $proof = @($files | Where-Object Name -CEQ ($name + '.sha256.json'))
            $sums = @($files | Where-Object Name -CEQ $kind.sums)
            if ($asset.Count -ne 1 -or $proof.Count -ne 1 -or $sums.Count -ne 1) { throw 'Missing or duplicate release assets.' }
            $hash = Get-Content $proof[0].FullName -Raw | ConvertFrom-Json
            $actual = (Get-FileHash $asset[0].FullName -Algorithm SHA256).Hash
            if ($hash.file -cne $name -or $hash.sha256 -ine $actual) { throw 'ZIP checksum mismatch.' }
            if ((Get-Content $sums[0].FullName -Raw).Trim() -ine "$actual  $name") { throw 'SHA256SUMS mismatch.' }
          }
          $assets = @($files | ForEach-Object FullName)
          $notes = @'
          Adds a versioned compatibility bundle containing Accounts, Chinese localization, production dependencies and the shared prepare/apply coordinator. The standalone Accounts ZIP remains available. Existing account and localization state locations are retained; no official program files, account authorizations or conversation data are distributed.

          Automatic compatibility checks use only this repository's preview releases. Downloads are verified and prepared separately; application files are changed only after normal exit. The external bootstrap and watcher use version directories so their running code is not overwritten. See VALIDATION.md for the current test, interruption/recovery and installed-client results.

          Fixes Electron's ASAR virtual-filesystem handling in the official-update handoff by reading raw program metadata and bytes locally, without changing the host's global ASAR mode. Program compatibility and installed functionality are reported separately; a visible account menu is not treated as proof that switching is available.

          Unsupported complete official updates retain the explicit native-login confirmation introduced in preview.14. The native identity may differ from the selected Accounts quota account; saved Accounts authorizations remain available for later repair. Incomplete replacements, damaged files, conflicting records and active installers still prevent launch. Unknown programs are never patched, and no older program backup is written over a newer official update.

          Official updates take priority. Unsupported native programs are never guessed compatible or patched, and no older host backup is written over a newer official update. Saved independent authorizations remain available for a later compatible bundle. Native sign-in still requires the existing explicit identity confirmation. SSH account switching, quota charging, generation and real vendor-installer coverage are limited to the actual checks stated in VALIDATION.md.

          For existing combined installations, use the compatibility bundle's Install-Compatibility.ps1 with the registered Node, host and state locations. It preserves the old shortcut originals and account store. Existing Accounts-only users can continue using their standalone install/restore commands. Read the bundled documentation before changing installation paths.
          '@
          [IO.File]::WriteAllText('release-notes.md', $notes, [Text.UTF8Encoding]::new($false))
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title "Antigravity Accounts $env:VALIDATED_VERSION" --prerelease --latest=false --verify-tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
