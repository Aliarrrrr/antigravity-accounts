name: Release Next

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and validate release
        shell: pwsh
        run: ./scripts/Publish-Next.ps1 -Release -Installer
      - name: Locate and test package
        shell: pwsh
        run: |
          $manifestFile = Get-ChildItem artifacts/next -Recurse -Filter 'package-manifest.json' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $manifestFile) { throw 'Next package manifest missing.' }
          $package = $manifestFile.Directory.FullName
          $release = Split-Path $package -Parent
          $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($manifest.version)") { throw 'Tag does not match package version.' }
          if ($manifest.application -ne 'AntigravityProfileHubNext' -or -not $manifest.experimental -or $manifest.manualAcceptance) {
            throw 'Unexpected Next compatibility claims.'
          }
          ./scripts/Test-NextPackage.ps1 -PackageRoot $package
          ./scripts/Test-NextInstaller.ps1 -InstallerPath (Get-ChildItem $release -Filter 'AGProfileHubNext-Setup-*.exe' | Select-Object -First 1 -ExpandProperty FullName)
          "RELEASE_ROOT=$release" | Out-File $env:GITHUB_ENV -Append
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AGProfileHubNext-${{ github.ref_name }}-win-x64
          path: |
            artifacts/next/*/*/AGProfileHubNext-*-win-x64.zip
            artifacts/next/*/*/AGProfileHubNext-*-win-x64.zip.sha256.json
            artifacts/next/*/*/AGProfileHubNext-Setup-win-x64-*.exe
            artifacts/next/*/*/AGProfileHubNext-Setup-win-x64-*.exe.sha256.json
          if-no-files-found: error
      - name: Create experimental GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem $env:RELEASE_ROOT -File | Where-Object { $_.Extension -in '.zip','.exe','.json' } | ForEach-Object FullName
          $notes = 'Windows x64 Next experimental build for Antigravity 2.19.1. Independent A/B login and restart persistence were manually checked. Full browser OAuth callback routing remains unconfirmed; actual SSH connection testing was skipped. Workspace paths are metadata only. See README and docs/VALIDATION.md before use.'
          gh release create $env:GITHUB_REF_NAME $assets --title "Antigravity Profile Hub Next $env:GITHUB_REF_NAME" --prerelease --latest=false --verify-tag --notes $notes
