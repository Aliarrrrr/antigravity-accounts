name: build-and-release

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 验证标签与集中版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & ./hub.ps1 version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与版本 v$version 不一致。"
          }
          & ./hub.ps1 check -Release -LockedRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 锁定还原、构建与控制台测试
        run: |
          & ./scripts/Build.ps1 -LockedRestore -Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 5.1 入口检查
        shell: powershell
        run: |
          & ./hub.ps1 check -LockedRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 正式标签发布（再次构建与测试）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          & ./scripts/Publish.ps1 -Release -LockedRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传成功的标签产物
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: AGProfileHub-${{ github.ref_name }}-win-x64
          path: |
            artifacts/package/**/*.zip
            artifacts/package/**/*.sha256
            artifacts/package/**/*.sha256.json
          if-no-files-found: error
