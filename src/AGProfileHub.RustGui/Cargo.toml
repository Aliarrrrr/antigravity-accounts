[package]
name = "agprofilehub-rust-gui"
version = "2.19.1"
edition = "2021"
authors = ["Antigravity Team"]
description = "Antigravity Profile Hub Next - Modern Rust GUI with Liquid Glass Effects"

[dependencies]
tao = "0.37"
wry = "0.57"
window-vibrancy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
